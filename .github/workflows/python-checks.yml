name: Python checks

on:
  push:
    branches: [main, vercel-academic-api]
  pull_request:
    branches: [main]

jobs:
  syntax-and-conversation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check app syntax
        run: python -m py_compile app.py course_data.py programme_data.py backend/main.py backend/programme_data.py
      - name: Run complete unittest suite
        run: python -m unittest discover -s tests -v
