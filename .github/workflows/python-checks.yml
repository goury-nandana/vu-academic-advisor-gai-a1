name: Python and frontend checks

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile app.py course_data.py advisor_guardrails.py upload_support.py benchmark_runner.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install knowledge exporter dependency
        run: pip install openpyxl
      - name: Export VU academic knowledge for the web API
        run: python ../scripts/export_frontend_knowledge.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve patched frontend dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm ci
      - name: Report npm dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log("npm audit counts:", JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name,item] of Object.entries(a.vulnerabilities ?? {})) { const via=(item.via ?? []).map(v => typeof v === "string" ? v : {title:v.title,url:v.url,range:v.range,severity:v.severity}); console.log(name + " | " + item.severity + " | direct=" + item.isDirect + " | range=" + item.range + " | fix=" + JSON.stringify(item.fixAvailable) + " | via=" + JSON.stringify(via)); }'
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Next.js frontend
        run: npm run build

      - name: Commit generated academic data and verified dependency lockfile
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git -C .. add frontend/package-lock.json frontend/data/vu-academic-knowledge.json
          if ! git -C .. diff --cached --quiet; then
            git -C .. -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Export VU academic knowledge for web advisor"
            git -C .. push origin HEAD:main
          fi
